---
# Local test compose for the rebranded Virtual Marketer Ticketing (Zammad) build.
# Builds the app image from local source instead of pulling the upstream Zammad image.
#
# ---------------------------------------------------------------------------
# DO NOT RUN THIS ON A DEVELOPER LAPTOP.
#
# The full stack (Rails + scheduler + websocket + Postgres + Redis + memcached)
# plus a Zendesk import is enough to exhaust memory and swap on a 16GB machine
# and take the desktop down with it. It has done exactly that here.
#
# Use a real server instead: see the deployment repo's compose file, which
# is sized for a host with headroom and includes Elasticsearch.
#
# This file is kept only for building/inspecting the image locally
# (`docker compose -f docker-compose.local.yml build`), not for running it.
#
# Note `restart: "no"` throughout — deliberate, so an accidental `up` cannot
# survive a reboot and quietly resume eating the machine.
# ---------------------------------------------------------------------------
x-shared:
  zammad-service: &zammad-service
    environment: &zammad-environment
      MEMCACHE_SERVERS: zammad-memcached:11211
      POSTGRESQL_DB: zammad_production
      POSTGRESQL_HOST: zammad-postgresql
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: zammad
      POSTGRESQL_PORT: 5432
      POSTGRESQL_OPTIONS: "?pool=50"
      REDIS_URL: redis://zammad-redis:6379
      TZ: "Europe/Berlin"
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pass the real revision at build time so the About dialog is accurate:
        #   COMMIT_SHA=$(git rev-parse HEAD) docker compose -f docker-compose.local.yml build
        COMMIT_SHA: ${COMMIT_SHA:-unknown}
    restart: "no"
    volumes:
      - zammad-storage:/opt/zammad/storage
    depends_on:
      zammad-memcached:
        condition: service_healthy
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy

services:
  zammad-init:
    <<: *zammad-service
    command: ["zammad-init"]
    depends_on:
      zammad-postgresql:
        condition: service_healthy
    restart: on-failure
    user: 0:0

  zammad-memcached:
    command: memcached -m 256M
    image: memcached:1.6.42-alpine
    restart: "no"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  zammad-nginx:
    <<: *zammad-service
    command: ["zammad-nginx"]
    ports:
      - "8090:8080"
    depends_on:
      zammad-railsserver:
        condition: service_healthy

  zammad-postgresql:
    environment:
      POSTGRES_DB: zammad_production
      POSTGRES_USER: zammad
      POSTGRES_PASSWORD: zammad
    image: postgres:17.10-alpine
    restart: "no"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  zammad-railsserver:
    <<: *zammad-service
    command: ["zammad-railsserver"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  zammad-redis:
    image: redis:8.8-alpine
    restart: "no"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  zammad-scheduler:
    <<: *zammad-service
    command: ["zammad-scheduler"]

  zammad-websocket:
    <<: *zammad-service
    command: ["zammad-websocket"]

volumes:
  postgresql-data:
    driver: local
  redis-data:
    driver: local
  zammad-storage:
    driver: local
