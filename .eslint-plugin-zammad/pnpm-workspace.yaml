---
# This file acts as a workspace root boundary for pnpm.
# Without it, pnpm would walk up to the repo root pnpm-workspace.yaml
# (added in the pnpm v11 update) and treat this package as part of that
# workspace, causing `pnpm install` here to be a no-op and skipping the
# installation of this package's local dependencies.

# Restore old default behavior like in pnpm v10.
verifyDepsBeforeRun: false

# mocha 11 pins serialize-javascript 6, and only 7.0.5 is fixed. 7 keeps the
# same CommonJS entry point; its breaking change is Node >= 20.
overrides:
  serialize-javascript@6: ^7.0.5
