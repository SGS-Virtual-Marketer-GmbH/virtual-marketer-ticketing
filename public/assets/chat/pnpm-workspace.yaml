---
# gulp 4 pins minimatch 3.0.x; 3.1.3 is the fixed release of the same major.
overrides:
  minimatch@3: ^3.1.3
  # autoprefixer/postcss and sass pin source-map-js below the fixed 1.2.2.
  source-map-js@1: ^1.2.2

allowBuilds:
  es5-ext: true
  fsevents: false

# Restore old default behavior like in pnpm v10.
verifyDepsBeforeRun: false
